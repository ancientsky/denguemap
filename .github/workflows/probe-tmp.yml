name: probe-tmp
on:
  workflow_dispatch:
  push:
    branches: [claude/hopeful-cannon-ldz7fp]
    paths: [".github/workflows/probe-tmp.yml"]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          cat > probe.mjs <<'JS'
          const BASE = 'https://cdcdengue.azurewebsites.net/';
          async function post(m, body) {
            const r = await fetch(BASE + 'DengueData.asmx/' + m, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify(body) });
            const t = await r.text();
            return { status: r.status, headers: Object.fromEntries([...r.headers].filter(([k]) => /server|date|arr|x-|etag|last-mod|content-length|set-cookie/i.test(k))), d: (() => { try { return JSON.parse(JSON.parse(t).d) || []; } catch { return null; } })() };
          }
          const byYear = (a) => { const m = {}; for (const r of a) { const y = r.sickdate.slice(0, 4); m[y] = (m[y] || 0) + 1; } return m; };
          for (let i = 0; i < 6; i++) {
            const a = await post('GetDengueLocation', { citycode: 'all', immigration: '0', startDate: '2022/01/01', endDate: '2026/10/16' });
            const b = await post('GetImportedData', {});
            console.log(new Date().toISOString(), 'loc', JSON.stringify(byYear(a.d || [])), 'importedN', b.d && b.d.length, JSON.stringify(a.headers));
            await new Promise((r) => setTimeout(r, 20000));
          }
          const city = await post('GetDengueLocation', { citycode: '07', immigration: '0', startDate: '2023/01/01', endDate: '2023/12/31' });
          console.log('kaohsiung 2023 n', city.d && city.d.length);
          JS
          node probe.mjs
