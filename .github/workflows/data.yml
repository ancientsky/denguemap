name: data

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Accept case counts lower than the committed data (use after an official correction)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync to branch tip
        # runs are serialized, so a queued run may have checked out a commit
        # that predates the previous run's data commit
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "$REF_NAME"
          git merge --ff-only FETCH_HEAD

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # no lifecycle scripts: this job holds a write token
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npx vitest run tests/data

      - name: Fetch and build data
        env:
          DATA_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: npm run data

      - name: Commit data
        id: commit
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: update $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$REF_NAME" && git push origin "HEAD:refs/heads/$REF_NAME"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Committed data update to $REF_NAME." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "Could not push the data commit." >&2
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' && github.ref_name == 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
