name: probe-data-sources
on:
  push:
    branches: [claude/hopeful-cannon-ldz7fp]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: mirror old site pages and scripts
        shell: bash
        run: |
          set +e
          mkdir -p site && cd site
          B=https://cdcdengue.azurewebsites.net
          for p in "" default.aspx ma.aspx denguecluster.aspx VectorMap.aspx imported.aspx trend.aspx Trend.aspx about.aspx data.aspx DengueData.asmx; do
            f="page_${p:-index}.html"
            curl -sS -L --connect-timeout 15 --max-time 60 -o "$f" -w "$p -> %{http_code} %{size_download}\n" "$B/$p"
          done
          # collect script/css/json/asmx/ashx references
          grep -hoiE '(src|href)="[^"]+"' page_*.html | sed -E 's/^(src|href)="//I; s/"$//' | grep -viE '^(https?:)?//|^#|^mailto|^javascript' | sort -u > refs.txt
          grep -hoiE '["'"'"'][^"'"'"' ]*\.(asmx|ashx|json|csv|geojson|aspx)[^"'"'"' ]*["'"'"']' page_*.html | sort -u > endpoints_html.txt
          while read -r r; do
            case "$r" in *.js*|*.json*|*.css*) ;; *) continue;; esac
            out="asset_$(echo "$r" | tr '/?=&' '____')"
            curl -sS -L --connect-timeout 15 --max-time 60 -o "$out" -w "$r -> %{http_code} %{size_download}\n" "$B/${r#/}"
          done < refs.txt
          grep -hoiE '["'"'"'][^"'"'"' ]*\.(asmx|ashx|json|csv|geojson|aspx|svc)[^"'"'"' ]*["'"'"']|url *: *["'"'"'][^"'"'"']+["'"'"']' asset_* page_*.html | sort | uniq -c | sort -rn > endpoints.txt
          echo "### endpoints"; cat endpoints.txt
          echo "### external hosts"; grep -hoE 'https?://[a-zA-Z0-9.-]+' page_*.html asset_* | sort | uniq -c | sort -rn | head -40
          echo "### od.cdc http"; curl -sS --connect-timeout 10 -o /dev/null -w "%{http_code}\n" http://od.cdc.gov.tw/eic/Dengue_Daily.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oldsite
          path: site/
          retention-days: 3
