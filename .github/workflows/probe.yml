name: probe-data-sources
on:
  push:
    branches: [claude/hopeful-cannon-ldz7fp]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          urls=(
            "https://od.cdc.gov.tw/eic/Dengue_Daily.csv"
            "https://od.cdc.gov.tw/eic/Dengue_Daily_last12m.csv"
            "https://od.cdc.gov.tw/eic/Dengue_Daily_EN.csv"
            "https://od.cdc.gov.tw/eic/MosIndex_All_last12m.csv"
            "https://od.cdc.gov.tw/eic/MosIndex_All.csv"
            "https://nidss.cdc.gov.tw/download/Dengue_Daily.csv"
            "https://nidss.cdc.gov.tw/download/MosIndex/MosIndex_All_last12m.csv"
            "https://data.cdc.gov.tw/api/3/action/package_show?id=dengue-case-clustering-area-2w"
            "https://data.cdc.gov.tw/api/3/action/package_search?q=dengue&rows=50"
            "https://data.cdc.gov.tw/api/3/action/package_search?q=%E7%99%BB%E9%9D%A9%E7%86%B1&rows=50"
            "https://data.gov.tw/api/v2/rest/dataset/21025"
            "https://data.gov.tw/api/v2/rest/dataset/21026"
            "https://data.gov.tw/api/v2/rest/dataset/24385"
            "https://data.gov.tw/api/v2/rest/dataset/24159"
          )
          mkdir -p out
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "=================== $u"
            curl -sS -L --max-time 120 -o "out/$i.bin" -D "out/$i.h" -H "Origin: https://ancientsky.github.io" -w "HTTP %{http_code} size=%{size_download} time=%{time_total} final=%{url_effective}\n" "$u"
            grep -iE "^(content-type|access-control|content-length|last-modified|etag|cache-control|content-encoding)" "out/$i.h"
            file "out/$i.bin"
            echo "--- head:"
            head -c 1500 "out/$i.bin" | iconv -f utf-8 -t utf-8 -c; echo
            if grep -q "csv" <<< "$u"; then echo "--- lines: $(wc -l < out/$i.bin)"; echo "--- tail:"; tail -n 3 "out/$i.bin"; fi
          done
          echo "=================== cluster resources"
          python3 - <<'PY'
          import json,glob
          for f in sorted(glob.glob('out/*.bin')):
              try: d=json.load(open(f,encoding='utf-8'))
              except Exception: continue
              res=d.get('result')
              pkgs = res.get('results',[]) if isinstance(res,dict) and 'results' in res else ([res] if isinstance(res,dict) else [])
              for p in pkgs:
                  print('PKG', p.get('name'), '|', p.get('title'))
                  for r in p.get('resources',[]):
                      print('   RES', r.get('format'), r.get('url'), '|', r.get('name'))
              if isinstance(d.get('result'),dict) and 'distribution' in d['result']:
                  for r in d['result']['distribution']: print('  DIST', r)
          PY
      - name: fetch cluster resources found
        shell: bash
        run: |
          set +e
          for u in $(python3 -c "
          import json,glob
          s=set()
          for f in glob.glob('out/*.bin'):
              try: d=json.load(open(f,encoding='utf-8'))
              except Exception: continue
              res=d.get('result')
              pkgs = res.get('results',[]) if isinstance(res,dict) and 'results' in res else ([res] if isinstance(res,dict) else [])
              for p in pkgs:
                  for r in p.get('resources',[]):
                      u=r.get('url','')
                      if u and ('lust' in u.lower() or 'mos' in u.lower() or 'dengue' in u.lower()): s.add(u)
          print('\n'.join(sorted(s)[:25]))
          "); do
            echo "=================== $u"
            curl -sS -L --max-time 120 -o r.bin -D r.h -H "Origin: https://ancientsky.github.io" -w "HTTP %{http_code} size=%{size_download}\n" "$u"
            grep -iE "^(content-type|access-control|last-modified)" r.h
            head -c 1200 r.bin | iconv -f utf-8 -t utf-8 -c; echo
          done
