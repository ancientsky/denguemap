name: probe-data-sources
on:
  push:
    branches: [claude/hopeful-cannon-ldz7fp]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: round2 code dump
        shell: bash
        run: |
          set +e
          mkdir -p site && cd site
          B=https://cdcdengue.azurewebsites.net
          for p in "" Timemap.aspx Index.aspx DengueCluster.aspx VectorMap.aspx Imported.aspx ma.aspx; do
            f="page_${p:-root}.html"
            curl -sS -L --connect-timeout 15 --max-time 60 -o "$f" -w "$p -> %{http_code} %{size_download} %{url_effective}\n" "$B/$p"
          done
          echo "##### per-page scripts (custom only) and inline scripts"
          python3 - <<'PY'
          import re,glob
          for f in sorted(glob.glob('page_*.html')):
              t=open(f,encoding='utf-8',errors='replace').read()
              print('==',f,len(t))
              print(' SRC:',[s for s in re.findall(r'<script[^>]*src="([^"]*)"',t) if '__customized' in s or 'pathmap' in s or 'highcharts' in s or 'datatables' in s])
              print(' LINKS css:',re.findall(r'<link[^>]*href="([^"]*)"',t))
              for m in re.finditer(r'<script(?![^>]*src)[^>]*>(.*?)</script>',t,re.S):
                  b=m.group(1)
                  if 'google-analytics' in b: continue
                  print(' INLINE SCRIPT:',b.strip()[:2500])
          PY
          for r in resource/__workers/1.0/dwork_ajax.js resource/__workers/1.0/shared_GETGEO.js resource/__workers/1.0/village309.js resource/__workers/1.0/ns1hosp_worker.js resource/__customized/1.0/main.js resource/__customized/1.0/masterpage.js resource/__customized/1.0/InsectTable.js resource/__customized/1.0/InsectTour.js resource/Semantic-UI/2.0.3/pathmap.js resource/__customized/1.0/DengueCluster.js resource/__customized/1.0/InsectCluster.js resource/__customized/1.0/Insectarea.js resource/__customized/1.0/loadmalayer.js resource/__customized/1.0/ns1hosp.js resource/__customized/1.0/general.js resource/__customized/1.0/timemap.js resource/__customized/1.0/area.js; do
            out="js_$(basename $r)"
            curl -sS -L --connect-timeout 15 --max-time 60 -o "$out" -w "$r -> %{http_code} %{size_download}\n" "$B/$r"
          done
          pr() { echo "######## $1 lines $2-$3"; sed -n "$2,$3p" "js_$1" | cut -c1-240; }
          for f in dwork_ajax.js shared_GETGEO.js village309.js ns1hosp_worker.js masterpage.js InsectTable.js InsectTour.js; do echo "######## FULL $f"; cat js_$f | cut -c1-240; done
          echo "######## FULL main.js"; cat js_main.js | iconv -c -f utf-8 -t utf-8 | cut -c1-240
          pr pathmap.js 1 80
          pr pathmap.js 270 330
          pr DengueCluster.js 1 120
          pr DengueCluster.js 235 365
          pr InsectCluster.js 596 640
          pr InsectCluster.js 840 870
          pr Insectarea.js 590 700
          pr loadmalayer.js 125 165
          pr loadmalayer.js 285 320
          pr ns1hosp.js 140 185
          pr timemap.js 60 100
          pr timemap.js 335 375
          pr general.js 60 95
          echo "##### misc static probes"
          for u in data/geojson/cdcdengueVillagePoint.json data/InsectTable/TableColumns.json data/geojson/village_full_comp.json data/dengue_layer/vill309_comp.json data/ns1/ns1hosp_20160603_lzstring.json data/geojson/city.json; do
            curl -sS -L --connect-timeout 15 --max-time 90 -o /tmp/x -D /tmp/h -w "$u -> %{http_code} %{size_download}\n" "$B/$u"; grep -iE '^(content-type|access-control|last-modified)' /tmp/h; head -c 300 /tmp/x; echo
          done
          for u in https://zone.cdc.gov.tw/map/csv/cdcdengueData_test.csv https://zone.cdc.gov.tw/map/geojson/cdcdengueVillage.json https://epimap.cdc.gov.tw/cdcdengue; do
            curl -sS -L --connect-timeout 15 --max-time 90 -H "Origin: https://ancientsky.github.io" -o /tmp/x -D /tmp/h -w "$u -> %{http_code} %{size_download}\n" "$u"; grep -iE '^(HTTP|content-type|access-control|last-modified)' /tmp/h; head -c 600 /tmp/x; echo
          done
