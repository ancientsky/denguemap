name: probe-data-sources
on:
  push:
    branches: [claude/hopeful-cannon-ldz7fp]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: round7 misc
        shell: bash
        run: |
          set +e
          mkdir -p site && cd site
          B=https://cdcdengue.azurewebsites.net
          cat > probe.py <<'PY'
          import json,time,sys,urllib.request,urllib.error,datetime,collections,gzip
          B='https://cdcdengue.azurewebsites.net/'
          ORIGIN='https://ancientsky.github.io'
          def call(path,body=None,method=None,ctype='application/json; charset=utf-8',timeout=120,gz=False):
              data=None
              if body is not None: data=body.encode() if isinstance(body,str) else json.dumps(body).encode()
              hdr={'Origin':ORIGIN,'User-Agent':'Mozilla/5.0'}
              if gz: hdr['Accept-Encoding']='gzip'
              if data is not None or method=='POST': hdr['Content-Type']=ctype
              req=urllib.request.Request(path if path.startswith('http') else B+path,data=data,headers=hdr,method=method or ('POST' if data is not None else 'GET'))
              t=time.time()
              try:
                  r=urllib.request.urlopen(req,timeout=timeout); code=r.status; h=r.headers; b=r.read()
              except urllib.error.HTTPError as e:
                  code=e.code; h=e.headers; b=e.read()
              except Exception as e:
                  print('  EXC',repr(e)); return None,None,b''
              dt=time.time()-t
              keep={k:v for k,v in h.items() if k.lower() in ('content-type','content-length','access-control-allow-origin','content-encoding','cache-control','last-modified')}
              if b[:2]==b'\x1f\x8b': b=gzip.decompress(b)
              print('  status',code,'bytes(decoded)',len(b),'secs %.1f'%dt,keep)
              return code,h,b
          def stats(recs):
              if not recs or not isinstance(recs[0],dict): return
              keys=list(recs[0].keys()); print('  KEYS:',keys)
              for k in keys:
                  vals=[r.get(k) for r in recs if isinstance(r,dict)]
                  try: u=collections.Counter(vals)
                  except TypeError: continue
                  if len(u)<=25: print('   ',k,'->',dict(u.most_common(25)))
                  else:
                      sv=[v for v in vals if isinstance(v,(str,int,float))]
                      try: print('   ',k,'-> %d unique, min=%r max=%r'%(len(u),min(sv),max(sv)))
                      except Exception: print('   ',k,'-> %d unique'%len(u))
          def show(b,nrec=3,raw=800):
              s=b.decode('utf-8','replace')
              print('  RAW[:%d]:'%raw,s[:raw].replace(chr(10),' '))
              try: j=json.loads(s)
              except Exception as e: print('  not json',e); return None
              inner=j
              if isinstance(j,dict) and 'd' in j:
                  d=j['d']
                  if isinstance(d,str):
                      try: inner=json.loads(d)
                      except Exception as e: print('  inner not json',e,d[:300]); return d
                  else: inner=d
              if isinstance(inner,dict) and 'features' in inner:
                  f=inner['features']; print('  GEOJSON features:',len(f),{k:inner[k] for k in inner if k not in('features','crs')})
                  for x in f[:nrec]: print('  FEATURE props',json.dumps(x.get('properties'),ensure_ascii=False)[:900],'geom',json.dumps(x.get('geometry'))[:160])
                  stats([x.get('properties',{}) for x in f])
              elif isinstance(inner,list):
                  print('  LIST len',len(inner))
                  for x in inner[:nrec]: print('  REC',json.dumps(x,ensure_ascii=False)[:600])
                  stats(inner)
              else: print('  ',type(inner).__name__,json.dumps(inner,ensure_ascii=False)[:1200])
              return inner
          PY
          cat > ep7.py <<'PY'
          import sys; sys.path.insert(0,'.')
          from probe import *
          def P(t): print(chr(10)+'=== '+t)
          P('GetImportedData lat/lng + country stats')
          c,h,b=call('DengueData.asmx/GetImportedData','')
          imp=json.loads(json.loads(b)['d'])
          print('unique lat/lng',collections.Counter((x['lat'],x['lng']) for x in imp).most_common(8))
          print('date range',min(x['sickdate'] for x in imp),max(x['sickdate'] for x in imp))
          print('by year x country top', sorted(collections.Counter((x['sickdate'][:4],x['country_code']) for x in imp).items())[:12])
          P('local vs imported by year (all from 1998)')
          for imm in ['0','1']:
              c,h,b=call('DengueData.asmx/GetDengueLocation',"{citycode:'all', immigration: '%s', startDate: '1998/01/01', endDate: '2026/10/16' }"%imm)
              d=json.loads(json.loads(b)['d']); print('imm',imm,'total',len(d)); print(' by year',sorted(collections.Counter(x['sickdate'][:4] for x in d).items()))
              print(' unique coords',len(set((x['lat'],x['lng']) for x in d)))
          P('VillagePoint: non-null stats via gz sizes')
          for u in ['data/geojson/cdcdengueVillagePoint.json','data/geojson/cdcdengueVillage.json','data/geojson/village_ori_point.json','data/ns1/ns1hosp_20160603_lzstring.json','data/geojson/city_ori.json']:
              c,h,b=call(u,gz=True)
          c,h,b=call('data/geojson/cdcdengueVillagePoint.json')
          j=json.loads(b)
          nn=collections.Counter()
          ex={}
          for f in j['features']:
              p=f['properties']
              for k in ('mosquito_house_level','bucket_positive_rate','bucket_total_eggs','gravitrap_positive_rate'):
                  if p.get(k) is not None: nn[k]+=1; ex.setdefault(k,p)
              for w in p['weeks']:
                  for k in ('m_level','b_pos','g_pos'):
                      if w.get(k) is not None: nn['week_'+k]+=1; ex.setdefault('w'+k,(p['COUNTY'],p['TOWN'],p['VILLAGE'],w))
          print('non-null counts',dict(nn))
          for k,v in ex.items(): print(' EX',k,json.dumps(v,ensure_ascii=False)[:600])
          print('mosquito_color',collections.Counter(f['properties']['mosquito_color'] for f in j['features']))
          print('week colors',collections.Counter(w['color'] for f in j['features'] for w in f['properties']['weeks']))
          P('other open files on host')
          for u in ['robots.txt','sitemap.xml','data/','data/geojson/','crossdomain.xml','web.config','DengueData.asmx?wsdl','DengueData.asmx?WSDL','DengueData.asmx/GetDengueLocation?citycode=all']:
              c,h,b=call(u); print('   ',u,c,b[:100])
          PY
          python3 ep7.py 2>&1 | cut -c1-1800
